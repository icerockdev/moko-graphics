name: Create release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version'
        default: '0.1.0'
        required: true
jobs:
  publish:
    name: Publish library at mavenCentral
    runs-on: ${{ matrix.os }}
    env:
      OSSRH_USER: ${{ secrets.OSSRH_USER }}
      OSSRH_KEY: ${{ secrets.OSSRH_KEY }}
      SIGNING_KEY_ID: ${{ secrets.SIGNING_KEYID }}
      SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
      SIGNING_KEY: ${{ secrets.GPG_KEY_CONTENTS }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Publish
        run: ./gradlew publish -DIS_MAIN_HOST=${{ matrix.os == 'ubuntu-latest' }}
  release:
    name: Create release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create Release
        run: >
          gh release create "release/${{ github.event.inputs.version }}"
          --repo "${{ github.repository }}"
          --target "${{ github.sha }}"
          --title "${{ github.event.inputs.version }}"
          --notes "Will be filled later"
          --draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
